# Checks every pull request (and main): the code compiles and the tests pass on all three
# systems, formatting and lints are clean, dependencies have no known vulnerabilities, no
# secrets are committed, and the workflows themselves are safe. It builds no installers.
name: Check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1" # Mondays: new advisories for unchanged dependencies
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    env:
      # ExifTool is fetched below, so its tests must run, not skip.
      FRAMELOFT_REQUIRE_EXIFTOOL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - name: ExifTool (checksum-verified)
        run: node scripts/fetch-exiftool.mjs
      - run: npm run verify:rules
      - run: npm run check
      - run: npm test
      - run: npm run build

      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

  supply-chain:
    name: Dependencies and secrets
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the secret scan reads the whole history
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: npm advisories
        run: npm audit --audit-level=low
      # Fails on any known vulnerability. Warnings (crates marked unmaintained, and one
      # "unsound" notice in GTK 0.18) all come from Tauri's own Linux stack and have no
      # upgrade yet; they are listed in the log so they are seen.
      - name: Rust advisories
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
      - name: Secrets in files and history (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.0
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" checksums.txt | sed 's/ .*/  gitleaks.tgz/' | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks dir . --redact=100 --no-banner
          ./gitleaks git . --redact=100 --no-banner --log-opts=--all

  osv-scanner:
    name: OSV-Scanner
    permissions:
      contents: read # read the lock files
      security-events: write # upload results to the Security tab
      actions: read # the reusable workflow reads its own run
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      scan-args: |-
        -r
        ./

  workflows:
    name: Workflow lint
    runs-on: ubuntu-22.04
    permissions:
      contents: read # read the workflow files
      security-events: write # zizmor uploads its findings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl -sSfL -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o checksums.txt "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz\$" checksums.txt | sed 's/ .*/  actionlint.tgz/' | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          ./actionlint -no-color
      - uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          persona: auditor
