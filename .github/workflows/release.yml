# Builds installers for macOS (Apple Silicon + Intel), Windows and Linux, and attaches
# them to a draft GitHub Release, with checksums, build provenance, and copies under
# fixed names so README.md can link to "the latest .dmg / .exe" forever.
#
# It runs when release-please makes a release (see release-please.yml), from the
# Actions tab ("Run workflow"), or when a tag like v2.0.0 is pushed. Nothing is
# published: Liju presses Publish on the draft.
#
# Code signing is switched on by repository secrets and skipped when they are missing,
# so the workflow keeps working (unsigned) until they are added. What each secret is
# and how to get it: docs/code-signing.md, and for in-app updates docs/updates.md.
#
# Release builds use no caches, so nothing from another run can end up in an installer.
name: Build installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (leave empty to use the version in package.json)
        required: false
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.platform }} ${{ matrix.rust_target }})
    # Signing secrets are only handed to jobs in the "release" environment (created by
    # GitHub on first use; add reviewers there to approve each release build).
    environment: release
    permissions:
      contents: write # create the draft release and upload installers
      id-token: write # build provenance
      attestations: write # build provenance
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust_target: ""
          - platform: ubuntu-22.04
            args: ""
            rust_target: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit this run was started on. The tag may not exist yet: tauri-action
          # creates it with the draft release.

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Rust toolchain
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ -n "$RUST_TARGET" ]; then rustup target add "$RUST_TARGET"; fi

      - run: npm ci

      - name: Bundle ExifTool (checksum-verified)
        run: node scripts/fetch-exiftool.mjs

      # Turns signing on only for the secrets that are actually set. Tauri treats an
      # empty variable as "set", so they can't simply be passed through as env.
      - name: Code signing setup
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LUMIO_UPDATER_PUBKEY: ${{ vars.LUMIO_UPDATER_PUBKEY }}
        run: |
          put() { # name value -> $GITHUB_ENV (multi-line safe)
            local d
            d="EOF_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
            printf '%s<<%s\n%s\n%s\n' "$1" "$d" "$2" "$d" >> "$GITHUB_ENV"
          }
          echo "SIGNING_ARGS=" >> "$GITHUB_ENV"
          cfgs=()
          # In-app updates (Frameloft > Check for Updates… > Install and Restart). This key is
          # Tauri's own update-signing key, not an Apple or Windows certificate. Without it
          # the app still tells people about new versions and links to the download page.
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$LUMIO_UPDATER_PUBKEY" ]; then
            put TAURI_SIGNING_PRIVATE_KEY "$TAURI_SIGNING_PRIVATE_KEY"
            if [ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then put TAURI_SIGNING_PRIVATE_KEY_PASSWORD "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"; fi
            node -e '
              const repo = "https://github.com/" + process.env.GITHUB_REPOSITORY;
              require("fs").writeFileSync("src-tauri/tauri.updater.json", JSON.stringify({
                bundle: { createUpdaterArtifacts: true },
                plugins: { updater: {
                  pubkey: process.env.LUMIO_UPDATER_PUBKEY.trim(),
                  endpoints: [repo + "/releases/latest/download/latest.json"],
                  windows: { installMode: "passive" },
                } },
              }));'
            cfgs+=("src-tauri/tauri.updater.json")
            echo "In-app updates: on (update files are signed with the updater key)."
          else
            echo "::warning::In-app updates are off (TAURI_SIGNING_PRIVATE_KEY secret or LUMIO_UPDATER_PUBKEY variable not set). Frameloft will still announce new versions. See docs/updates.md."
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ]; then
              put APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
              put APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
              if [ -n "$APPLE_SIGNING_IDENTITY" ]; then put APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"; fi
              echo "macOS: signing with the Developer ID certificate."
              if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
                put APPLE_ID "$APPLE_ID"
                put APPLE_PASSWORD "$APPLE_PASSWORD"
                put APPLE_TEAM_ID "$APPLE_TEAM_ID"
                echo "macOS: notarising with Apple."
              else
                echo "::warning::macOS build is signed but NOT notarised (APPLE_ID, APPLE_PASSWORD or APPLE_TEAM_ID missing)."
              fi
            else
              # Ad-hoc signature: no Apple account needed. Without any signature macOS calls
              # a downloaded app "damaged"; with this one it shows the usual "can't be
              # verified" prompt, which System Settings > Privacy & Security > Open Anyway gets past.
              cfgs+=("src-tauri/tauri.macos-adhoc.json")
              echo "::warning::macOS build has an ad-hoc signature only (APPLE_CERTIFICATE secrets not set), so the first launch needs Open Anyway. See docs/code-signing.md."
            fi
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$AZURE_TENANT_ID" ] \
               && [ -n "$AZURE_SIGNING_ENDPOINT" ] && [ -n "$AZURE_SIGNING_ACCOUNT" ] && [ -n "$AZURE_SIGNING_PROFILE" ]; then
              put AZURE_CLIENT_ID "$AZURE_CLIENT_ID"
              put AZURE_CLIENT_SECRET "$AZURE_CLIENT_SECRET"
              put AZURE_TENANT_ID "$AZURE_TENANT_ID"
              # The command and each argument are kept apart (no shell string), so a
              # secret's value can never be read as another argument or command.
              node -e '
                const [endpoint, account, profile] = process.argv.slice(1);
                require("fs").writeFileSync("src-tauri/tauri.signing.json", JSON.stringify({ bundle: { windows: { signCommand: {
                  cmd: "artifact-signing-cli",
                  args: ["-e", endpoint, "-a", account, "-c", profile, "%1"],
                } } } }));' "$AZURE_SIGNING_ENDPOINT" "$AZURE_SIGNING_ACCOUNT" "$AZURE_SIGNING_PROFILE"
              cfgs+=("src-tauri/tauri.signing.json")
              echo "WINDOWS_SIGN=1" >> "$GITHUB_ENV"
              echo "Windows: signing with Azure Artifact Signing."
            else
              echo "::warning::Windows build is not signed (AZURE_* secrets not set). See docs/code-signing.md."
            fi
          fi
          # Merge the extra settings into one --config file.
          if [ ${#cfgs[@]} -gt 0 ]; then
            node -e '
              const fs = require("fs");
              const merge = (a, b) => { for (const [k, v] of Object.entries(b)) a[k] = v && typeof v === "object" && !Array.isArray(v) ? merge(a[k] || {}, v) : v; return a; };
              const out = process.argv.slice(1).reduce((acc, f) => merge(acc, JSON.parse(fs.readFileSync(f, "utf8"))), {});
              fs.writeFileSync("src-tauri/tauri.ci.json", JSON.stringify(out));' "${cfgs[@]}"
            echo "SIGNING_ARGS=--config src-tauri/tauri.ci.json" >> "$GITHUB_ENV"
          fi

      - name: Install the Azure signing tool (pinned)
        if: env.WINDOWS_SIGN == '1'
        run: cargo install artifact-signing-cli --version 0.12.0 --locked

      # The release text is this version's CHANGELOG.md section (the update window shows it).
      - name: Release notes
        id: notes
        shell: bash
        run: |
          {
            echo "body<<END_OF_NOTES"
            node scripts/release-notes.mjs || echo "See CHANGELOG.md for what's new."
            echo
            echo "Download the installer for your computer below. SHA256SUMS.txt lists the checksums."
            echo "END_OF_NOTES"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v__VERSION__' }}
          releaseName: Frameloft v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} ${{ env.SIGNING_ARGS }}
          # latest.json tells installed copies about the new version (only written when
          # the updater key is set, see above).
          uploadUpdaterJson: true

      # A downloaded Mac app with a broken or missing signature is "damaged" to macOS, so
      # check the .dmg and the in-app update the way a download is checked.
      - name: Check the Mac app's signature
        if: runner.os == 'macOS'
        shell: bash
        env:
          ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(node -e '
            for (const p of JSON.parse(process.env.ARTIFACTS || "[]"))
              if (/\.(dmg|app\.tar\.gz)$/.test(p) && require("fs").statSync(p).isFile()) console.log(p);')
          if [ ${#files[@]} -eq 0 ]; then echo "::error::no .dmg found to check"; exit 1; fi
          scripts/check-macos-app.sh "${files[@]}"

      - name: List the installers
        id: built
        shell: bash
        env:
          ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          node -e '
            const paths = JSON.parse(process.env.ARTIFACTS || "[]").filter((p) => require("fs").statSync(p).isFile());
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "paths<<END_OF_PATHS\n" + paths.join("\n") + "\nEND_OF_PATHS\n");'

      - name: Build provenance
        if: steps.built.outputs.paths != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.built.outputs.paths }}

  # Adds SHA256SUMS.txt and copies of the installers under names that never change,
  # so https://github.com/frameloft/Frameloft/releases/latest/download/<name> always
  # points at the newest version once the release is published.
  stable-names:
    name: Checksums and fixed-name copies
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write # upload SHA256SUMS.txt and the copies to the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Add checksums and fixed-name copies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then tag="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then tag="$REF_NAME"
          else tag="v$(node -p 'require("./package.json").version')"; fi
          mkdir dist && cd dist
          gh release download "$tag" --pattern '*'
          copy() { # pattern fixed-name
            local f
            f=$(find . -maxdepth 1 -name "$1" ! -name 'Frameloft-*-latest*' | head -n 1)
            if [ -n "$f" ]; then cp "$f" "$2"; echo "$2 <- $f"; fi
          }
          copy '*_aarch64.dmg' Frameloft-macOS-AppleSilicon.dmg
          copy '*_x64.dmg' Frameloft-macOS-Intel.dmg
          copy '*_x64-setup.exe' Frameloft-Windows-x64-setup.exe
          copy '*_x64_en-US.msi' Frameloft-Windows-x64.msi
          copy '*_amd64.AppImage' Frameloft-Linux-x86_64.AppImage
          copy '*_amd64.deb' Frameloft-Linux-amd64.deb
          copy '*.x86_64.rpm' Frameloft-Linux-x86_64.rpm
          rm -f SHA256SUMS.txt
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' ! -name '*.sig' ! -name 'latest.json' -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$tag" --clobber SHA256SUMS.txt Frameloft-*
